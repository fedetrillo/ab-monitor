  <rect width="512" height="512" rx="112" fill="#1b1e24"/>
  <defs><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb547" stop-opacity=".45"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient></defs>
  <circle cx="150" cy="270" r="150" fill="url(#g)"/>
  <rect x="56" y="78" width="188" height="300" rx="34" fill="#ffb547"/>
  <circle cx="150" cy="148" r="30" fill="#1b1e24"/>
  <circle cx="150" cy="276" r="66" fill="#1b1e24"/>
  <text x="150" y="304" font-family="Arial Rounded MT Bold, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" fill="#ffb547" text-anchor="middle">A</text>
  <rect x="268" y="78" width="188" height="300" rx="34" fill="none" stroke="#62c8f0" stroke-width="14"/>
  <circle cx="362" cy="148" r="26" fill="none" stroke="#62c8f0" stroke-width="12"/>
  <circle cx="362" cy="276" r="62" fill="none" stroke="#62c8f0" stroke-width="12"/>
  <text x="362" y="304" font-family="Arial Rounded MT Bold, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" fill="#62c8f0" text-anchor="middle">B</text>
  <path d="M120 432 H392" stroke="#e8e6e1" stroke-width="16" stroke-linecap="round"/>
  <path d="M352 404 L396 432 L352 460" fill="none" stroke="#e8e6e1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 404 L116 432 L160 460" fill="none" stroke="#e8e6e1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
